name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/Rudy.Chain.Tests -c Release
      - run: dotnet run --project tests/Rudy.Chain.Tests -c Release --no-build -- .
  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet pack src/Rudy.Chain.Cli -c Release -o artifacts
      - run: dotnet tool install Rudy.Chain.Tool --version 0.1.0 --tool-path .tools --add-source artifacts --configfile NuGet.Config
      - run: .tools/rudy-chain audit examples/before.cdx.json
      - run: .tools/rudy-chain why examples/before.cdx.json parser
      - uses: actions/upload-artifact@v4
        with:
          name: Rudy.Chain.Tool
          path: artifacts/*.nupkg
